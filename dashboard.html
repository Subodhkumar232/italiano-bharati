<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>Student Dashboard | Italiano Bharati Academy</title>

    <script>
        (function () {
            const isMobile = window.matchMedia("(max-width: 767px)").matches;

            if (isMobile) {
                window.location.replace("dashboard-mobile.html");
            } else {
                window.location.replace("dashboard-desktop.html");
            }
        })();
    </script>
</head>

<body>
    <noscript>
        <p>Please enable JavaScript to access the Italiano Bharati Student Dashboard.</p>
    </noscript>
</body>
</html>
